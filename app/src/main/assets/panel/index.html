<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DoDo WA Sender</title>
<style>
  body{font-family:Tahoma,Arial,sans-serif;margin:0;padding:0;overflow:hidden;direction:ltr;background:#f6f7f9;color:#111}
  h3{margin:0 0 8px;color:#128c7e}
  label{display:block;font-size:12px;margin:8px 0 3px;font-weight:bold}
  textarea,input{width:100%;box-sizing:border-box;padding:6px;border:1px solid #ccc;border-radius:6px;font-family:inherit;font-size:13px}
  textarea{resize:vertical}
  .row{display:flex;gap:6px}.row>div{flex:1}
  button{padding:8px 10px;border:0;border-radius:6px;cursor:pointer;font-weight:bold;font-family:inherit}
  #start{background:#25d366;color:#fff;flex:2}#resume{background:#128c7e;color:#fff;flex:1}#stop{background:#e53935;color:#fff;flex:1}
  #csv{background:#ddd;width:100%;margin-top:6px}
  .bar{height:8px;background:#ddd;border-radius:4px;margin-top:10px;overflow:hidden}
  #fill{height:100%;width:0;background:#25d366;transition:width .3s}
  #status{font-size:12px;margin-top:6px}
  #log{max-height:110px;overflow:auto;font-size:11px;background:#fff;border:1px solid #ddd;border-radius:6px;padding:4px;margin-top:6px}
  .ok{color:#128c7e}.bad{color:#e53935}
  small{color:#666}
  #panel{direction:rtl;width:100%;height:100vh;overflow-y:auto;overflow-x:hidden;padding:12px;box-sizing:border-box}
</style>
</head>
<body>
<div id="panel">
<h3>DoDo WA Sender</h3>
<label>الأرقام (رقم في كل سطر — اختياري: <code>رقم,اسم</code>) <small id="cnt"></small></label>
<textarea id="numbers" rows="5" placeholder="201001234567&#10;01012345678,أحمد"></textarea>
<label>الرسالة (استخدم {name} للاسم)</label>
<textarea id="message" rows="4" placeholder="مرحبا {name}، ..."></textarea>
<label>ملف / صورة (اختياري — الرسالة بتبقى الكابشن) — حد أقصى 10MB</label>
<input id="file" type="file">
<div id="fileinfo"><small></small> <button id="rmfile" style="display:none;background:#eee;padding:3px 8px">إزالة الملف</button></div>
<div class="row">
  <div><label>كود الدولة</label><input id="cc" value="20"></div>
  <div><label>أقل تأخير (ث)</label><input id="minD" type="number" min="3" value="15"></div>
  <div><label>أقصى تأخير (ث)</label><input id="maxD" type="number" min="3" value="30"></div>
</div>
<div class="row">
  <div><label>استراحة كل (رسالة)</label><input id="bs" type="number" min="0" value="30"></div>
  <div><label>مدة الاستراحة (دقيقة)</label><input id="bp" type="number" min="0" value="5"></div>
</div>
<div class="row" style="margin-top:10px">
  <button id="start">ابدأ</button><button id="resume">استكمال</button><button id="stop">إيقاف</button>
</div>
<div class="bar"><div id="fill"></div></div>
<div id="status"></div>
<div id="log"></div>
<button id="csv">تحميل النتائج CSV</button>
</div>
<script src="shim.js"></script>
<script src="renderer.js"></script>
</body>
</html>
